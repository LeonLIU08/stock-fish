# 2026-10-14 全量回测的固化配置。
# 结果目录: backtest_results/20261014-184350_1d_trend_state
# 初始止损回看 10 根、下方缓冲 1 倍 a_t，最大止损距离 8 倍 a_t，跟踪缓冲 5。
# 突破窗口仍是 20。schema 版本仍是 trend-strategy-v0。
#
# 复现这次全量:
#   bash scripts/run_trend_backtest.sh --config analysis/backtest/trend-strategy-wide-stop.yaml
version: trend-strategy-v0

structure:
  param_version: structure-params-v6
  price_axis: log          # log | uniform
  scale: short             # short | mid | long

prices:
  signal: adjusted         # 结构、a_t、EMA10、突破、止损
  fill: raw                # 成交、股数、现金、费用
  adjustment: proportional_from_first_bar
  dividends: cash_on_ex_date

unit:
  kind: log_true_range
  span: 14
  floor: 0.003

markets:
  hk:
    currency: HKD
    timezone: Asia/Hong_Kong
    capital: 1000000
    commission_rate: 0.0003
    min_commission: 3
    platform_fee: 0
    stamp_duty_rate: 0.001
    exchange_fee_rate: 0.000085
    settlement_rate: 0.00002
    dividend_withholding: 0.0
    benchmark: tracker_fund
  us:
    currency: USD
    timezone: America/New_York
    capital: 100000
    lot_size: 1
    commission_per_share: 0.005
    min_commission: 1.0
    max_commission_rate: 0.01
    sec_fee_rate: 0.0000278
    taf_per_share: 0.000166
    taf_max: 8.30
    dividend_withholding: 0.30
    benchmark: spy

universe:
  allow_short: false
  symbols:                 # 全量名单由 --symbols-file scripts/hkconnect_06Oct.txt 传入
    - code: "00700"
      name: "腾讯控股"
      lot_size: 100
    - code: "09988"
      name: "阿里巴巴"
      lot_size: 100
    - code: "NVDA"
      name: "英伟达"

window:
  start: 2025-10-14
  end: 2026-10-14
  lookback_years: 1
  warmup_bars: 250
  interval: 1d

strategies:
  breakout:
    entry:
      lookback: 20
      buffer: 0.2
      stop_lookback: 10
      stop_buffer: 1.0
    order:
      gap_cancel: 0.5
      max_stop_distance: 8.0
      slippage_rate: 0.0005
      max_trades_per_day: 2
    risk:
      risk_per_trade: 0.005
      one_lot_max_risk: 0.01
      max_gross_exposure: 1.0
      point_value: null
    exit:
      trail_buffer: 5.0
      trail_states: [up_continue, up_pullback]
      reduce_fraction: 0.5
      reduce_rounding: floor_lot_else_flatten
      exhaustion_action: reduce
  pullback:
    entry:
      lookback: 5
      break_lookback: 3
      stop_buffer: 1.0
    order:
      gap_cancel: 0.5
      max_stop_distance: 8.0
      slippage_rate: 0.0005
      max_trades_per_day: 2
    risk:
      risk_per_trade: 0.005
      one_lot_max_risk: 0.01
      max_gross_exposure: 1.0
      point_value: null
    exit:
      trail_buffer: 5.0
      trail_states: [up_continue, up_pullback]
      reduce_fraction: 0.5
      reduce_rounding: floor_lot_else_flatten
      exhaustion_action: reduce

benchmarks:
  tracker_fund:
    name: 盈富基金
    yahoo: "2800.HK"
  spy:
    name: SPDR 标普 500 ETF
    yahoo: "SPY"

evaluation:
  oos_ratio: 0.3
  rolling_window_days: 252
  extreme_days: 5
  audit: trades_and_cancels

runs:
  - key: breakout
    label: 策略 A
    strategy: breakout
  - key: pullback
    label: 策略 B
    strategy: pullback

output_dir: backtest_results
