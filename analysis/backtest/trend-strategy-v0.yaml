version: trend-strategy-v0

structure:
  param_version: structure-params-v6
  price_axis: log          # log | uniform
  scale: mid               # short | mid | long
  # 传开盘、最高、最低、成交量。开盘价让阶段影线分可计算

prices:                    # 第 4.4 节。第一期只接受这一组
  signal: adjusted         # 结构、a_t、EMA10、突破、止损
  fill: raw                # 成交、股数、现金、费用
  adjustment: proportional_from_first_bar
  dividends: cash_on_ex_date   # 扣预扣税后入账，不再投资

unit:                      # 第 7 节
  kind: log_true_range
  span: 14
  floor: 0.003

markets:                   # 第 8.1 节。费率是初值，按券商对账单改
  hk:
    currency: HKD
    timezone: Asia/Hong_Kong
    capital: 1000000
    commission_rate: 0.0003
    min_commission: 3
    platform_fee: 0              # 每单固定收费
    stamp_duty_rate: 0.001       # 买卖双方，进到整数港元
    exchange_fee_rate: 0.000085  # 交易费、证监会征费、会财局征费合计，买卖都收
    settlement_rate: 0.00002     # 交收费，第一期只按比例收，按对账单核对
    dividend_withholding: 0.0
    benchmark: tracker_fund
  us:
    currency: USD
    timezone: America/New_York
    capital: 100000
    lot_size: 1
    commission_per_share: 0.005
    min_commission: 1.0
    max_commission_rate: 0.01
    sec_fee_rate: 0.0000278      # 只在卖出；费率逐年变，按回测年份核对
    taf_per_share: 0.000166      # 只在卖出
    taf_max: 8.30
    dividend_withholding: 0.30
    benchmark: spy

universe:
  allow_short: false
  symbols:                 # 可逐只写 lot_size、dividend_withholding。港股没写 lot_size 就失败
    - code: "00700"
      name: "腾讯控股"
      lot_size: 100
    - code: "09988"
      name: "阿里巴巴"
      lot_size: 100
    - code: "NVDA"
      name: "英伟达"

window:
  start: null
  end: null
  lookback_years: 3
  warmup_bars: 250
  interval: 1d             # 第一期只接受 1d

strategies:                # 每个策略一份完整参数，互不引用
  breakout:                # 策略 A，第 6.1 节
    entry:
      lookback: 20
      buffer: 0.2
      stop_lookback: 4     # 信号当根及此前 4 根
      stop_buffer: 0.3
    order:
      gap_cancel: 0.5
      max_stop_distance: 4.0        # 初稿是 3，第 8.2 节
      slippage_rate: 0.0005
      max_trades_per_day: 2     # 不限制止损
    risk:
      risk_per_trade: 0.005
      one_lot_max_risk: 0.01    # 0 表示关闭一手规则
      max_gross_exposure: 1.0
      point_value: null
    exit:
      trail_buffer: 3.0
      trail_states: [up_continue, up_pullback]
      reduce_fraction: 0.5
      reduce_rounding: floor_lot_else_flatten
      exhaustion_action: reduce   # reduce | none
  pullback:                # 策略 B，第 6.2 节
    entry:
      lookback: 5
      break_lookback: 3
      stop_buffer: 0.3
    order:
      gap_cancel: 0.5
      max_stop_distance: 4.0        # 初稿是 3，第 8.2 节
      slippage_rate: 0.0005
      max_trades_per_day: 2
    risk:
      risk_per_trade: 0.005
      one_lot_max_risk: 0.01
      max_gross_exposure: 1.0
      point_value: null
    exit:
      trail_buffer: 3.0
      trail_states: [up_continue, up_pullback]
      reduce_fraction: 0.5
      reduce_rounding: floor_lot_else_flatten
      exhaustion_action: reduce

benchmarks:                # 含股息的 ETF，按第 4.4 节同一口径
  tracker_fund:
    name: 盈富基金
    yahoo: "2800.HK"
  spy:
    name: SPDR 标普 500 ETF
    yahoo: "SPY"

evaluation:
  oos_ratio: 0.3
  rolling_window_days: 252
  extreme_days: 5
  audit: trades_and_cancels   # 或 all_bars

runs:
  - key: breakout
    label: 策略 A
    strategy: breakout
  - key: breakout_no_reduce
    label: 策略 A，衰竭不减仓
    strategy: breakout
    exhaustion_action: none
  - key: pullback
    label: 策略 B
    strategy: pullback
  - key: pullback_no_reduce
    label: 策略 B，衰竭不减仓
    strategy: pullback
    exhaustion_action: none

output_dir: backtest_results
